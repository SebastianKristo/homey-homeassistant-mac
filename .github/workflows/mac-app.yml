name: Build MacBridge DMG

on:
  push:
    paths: ["mac-app/**", ".github/workflows/mac-app.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["mac-app/**", ".github/workflows/mac-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG
        run: mac-app/scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MacBridge-dmg
          path: mac-app/build/MacBridge.dmg
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mac-app/build/MacBridge.dmg
